[project]
name = "veri-tax"
version = "0.1.0"
description = "veri-tax verification body: VAT refund invoice verification API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.28.1",
    "pypdfium2>=5.15.2",
    "pillow>=13.0.0",
    "python-multipart>=0.0.34",
    "python-dotenv>=1.2.4",
    "paddleocr>=3 ; sys_platform == 'darwin'",
    "paddlepaddle>=3 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
